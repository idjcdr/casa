<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inforcacion – IDJ Casa de Refugio</title>

  <link rel="icon" type="image/png" href="https://i.postimg.cc/BQbhpGLg/Untitled-design.png">

  <!-- External Styles -->
   <link rel="stylesheet" href="/style.css"> 

  <!-- AOS Animation CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
</head>
  
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 900,
    easing: 'ease-in-out',
    once: true,
    mirror: false
  });
</script>
  
<body>

  <!-- Navigation -->

<div id="header"></div>

  <section class="section">
    <h2 id="dir-title">Dirección</h2>
    <p id="dir-text">2210 E Vista Way, Suite 10, Vista, CA 92084</p>

    <h2 id="services-title">Horarios de Servicios</h2>
    <ul id="service-list">
      <li><strong>Domingo:</strong> Servicio General - 4:30 PM</li>
      <li><strong>Lunes:</strong> Oracion - 7:00 PM</li>
      <li><strong>Martes:</strong> Servicio - 7:00 PM</li>
    </ul>

    <h2 id="phone-title">Teléfono</h2>
    <p id="phone-text">(760) 675-4847</p>

    <h2 id="email-title">Correo Electrónico</h2>
    <p id="email-text">casaderefugio0724@gmail.com</p>
  </section>

 <iframe
  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2763.6595828297804!2d-117.22911872512968!3d33.23377147347612!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80dc76fbd598b855%3A0x758f1c61cd5aa000!2s2210%20E%20Vista%20Way%20%2310%2C%20Vista%2C%20CA%2092084!5e1!3m2!1sen!2sus!4v1789501520293!5m2!1sen!2sus"
  width="100%"
  height="450"
  style="border:0;"
  loading="lazy"
  allowfullscreen
  referrerpolicy="no-referrer-when-downgrade"
  title="IDJ Casa de Refugio Location">
</iframe>
  
  <!-- Footer -->

<div id="footer"></div>

  <!-- AOS & Custom JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="/script.js"></script>

   <script>
    function toggleLanguage() {
      const isSpanish = document.documentElement.lang === "es";
      document.documentElement.lang = isSpanish ? "en" : "es";

      document.getElementById('nav-welcome').textContent = isSpanish ? "Welcome" : "Bienvenida";
      document.getElementById('nav-pastor').textContent = "Pastor";
      document.getElementById('nav-contact').textContent = isSpanish ? "Information" : "Información";
      document.getElementById('nav-gallery').textContent = isSpanish ? "Gallery" : "Galería";
      document.querySelector('.lang-btn').textContent = isSpanish ? "Español" : "English";

      document.getElementById('dir-title').textContent = isSpanish ? "Address" : "Dirección";
      document.getElementById('services-title').textContent = isSpanish ? "Service Times" : "Horarios de Servicios";
      document.getElementById('phone-title').textContent = isSpanish ? "Phone" : "Teléfono";
      document.getElementById('email-title').textContent = isSpanish ? "Email" : "Correo Electrónico";

      document.getElementById('service-list').innerHTML = isSpanish
        ? `
          <li><strong>Sunday:</strong> General Service - 4:30 PM</li>
          <li><strong>Monday:</strong> Prayer - 7:00 PM</li>
          <li><strong>Tuesday:</strong> Service - 7:00 PM</li>
        `
        : `
          <li><strong>Domingo:</strong> Servicio General - 4:30 PM</li>
          <li><strong>Lunes:</strong> Oracion - 7:00 PM</li>
          <li><strong>Martes:</strong> Servicio - 7:00 PM</li>
        `;

      document.getElementById("nav-offering").innerHTML = `
        <img src="https://cdn.iconscout.com/icon/free/png-256/venmo-2-569346.png" alt="Venmo" style="height: 20px;">
        ${isSpanish ? "Offering / Tithes" : "Ofrenda / Diezmo"}
      `;
    }

    function toggleDropdown() {
      const dropdown = document.getElementById("menuDropdown");
      dropdown.classList.toggle("show");
    }

    window.onclick = function(event) {
      if (!event.target.closest('.dropdown')) {
        const dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
          dropdowns[i].classList.remove('show');
        }
      }
    }
  </script>
</body>
</html>
